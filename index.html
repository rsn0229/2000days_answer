<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>닻과 파도의 항해일지 - 해설지 (흑백 만화 에디션)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      margin: 0; padding: 0;
      background-color: #e5e5e5;
      font-family: 'Gowun Dodum', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #1a1a1a;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #viewport-container {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow-x: auto;
      padding: 20px 0;
    }

    /* 인쇄용 여백 래퍼 (신국판 비율) */
    #print-wrapper {
      background-color: #ffffff;
      width: 950px;
      height: 1420px;
      padding: 87px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    /* 해설지 컨테이너 (위아래 102px, 양옆 78px 여백) */
    .a5-paper {
      position: relative;
      width: 724px;
      height: 1155px;
      padding: 102px 78px;
      background-color: #ffffff;
      border: 3px solid #1a1a1a;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tt-title {
      font-size: 32px; font-weight: bold; color: #1a1a1a;
      border-bottom: 3px solid #1a1a1a;
      padding-bottom: 12px; margin-bottom: 35px; text-align: center; width: 100%;
      margin-top: 0;
    }

    .question-box {
      width: 75%;
      background-color: #ffffff; padding: 22px 25px; border-radius: 4px;
      font-size: 21px; color: #1a1a1a; line-height: 1.6; text-align: center;
      box-shadow: 0 4px 0px #1a1a1a; 
      margin-bottom: 25px; 
      word-break: keep-all; border: 2px solid #1a1a1a;
      box-sizing: border-box;
    }

    .explanation {
      margin-top: auto; width: 100%; background: #f8f8f8;
      border: 2px solid #1a1a1a; border-radius: 8px; padding: 22px 25px;
      font-size: 21px; line-height: 1.6; color: #222222; box-sizing: border-box; word-break: keep-all;
    }

    .puzzle-view {
      width: 100%; display: flex; flex-direction: column; align-items: center;
      pointer-events: none; transform: scale(1.2); 
      margin-top: 55px; 
      margin-bottom: 35px;
    }

    .controls {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 12px; margin-top: 20px; margin-bottom: 40px; padding: 0 15px;
    }
    .custom-btn {
      padding: 12px 20px; background-color: #ffffff; border: 2px solid #1a1a1a;
      border-radius: 6px; color: #1a1a1a; font-family: inherit; font-size: 15px;
      font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 #1a1a1a; transition: all 0.1s;
    }
    .custom-btn:hover:not(:disabled) { background-color: #f0f0f0; transform: translateY(-1px); }
    .custom-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #1a1a1a; }
    .custom-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-highlight { background-color: #e0e0e0; }
    .btn-dark { background-color: #1a1a1a; color: #ffffff; }

    /* =========================================
       퍼즐 UI 공통 CSS
       ========================================= */
    .dial-lock-container { display: flex; gap: 8px; padding: 20px; background: #ffffff; border: 3px solid #1a1a1a; border-radius: 8px; box-shadow: 4px 4px 0 #1a1a1a; }
    .dial-digit { background: #f0f0f0; border: 2px solid #1a1a1a; border-radius: 4px; padding: 6px; text-align: center; }
    .dial-value { font-size: 34px; font-weight: bold; font-family: 'Courier New', monospace; color: #1a1a1a; width: 45px; margin: 12px 0; }
    
    .symbol-lock-container { display: flex; gap: 20px; }
    .symbol-btn { 
      width: 70px; height: 70px; font-size: 36px; 
      font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
      background: #ffffff; border: 2px solid #1a1a1a; border-radius: 8px; 
      display: flex; align-items: center; justify-content: center; 
      box-shadow: 3px 3px 0 #1a1a1a; 
      filter: grayscale(100%) contrast(1.3); 
    }

    .magic-slot-group { display: flex; gap: 8px; }
    .magic-slot { width: 40px; height: 50px; text-align: center; line-height: 50px; font-size: 26px; font-weight: bold; color: #1a1a1a; border-bottom: 3px solid #1a1a1a; border-top: 1px solid #ccc; background: #fafafa; }
    .magic-space { width: 20px; }

    .jigsaw-board { display: inline-grid; grid-template-columns: repeat(3, 75px); grid-template-rows: repeat(3, 75px); gap: 2px; background-color: #1a1a1a; border: 3px solid #1a1a1a; padding: 2px; }
    .jigsaw-piece { position: relative; width: 75px; height: 75px; overflow: hidden; background-color: #ffffff; }
    .jigsaw-piece img { position: absolute; width: 225px; height: 225px; max-width: none; display: block; filter: grayscale(100%) contrast(1.2); }

    .crossword-board { display: inline-grid; gap: 0; border: 3px solid #1a1a1a; background-color: #1a1a1a; padding: 2px; margin-bottom: 15px; }
    .cw-cell-wrapper { position: relative; width: 40px; height: 40px; background-color: #ffffff; }
    .cw-empty { background-color: transparent; }
    .cw-input { width: 100%; height: 100%; border: 1px solid #1a1a1a; text-align: center; font-size: 20px; font-weight: bold; font-family: 'Courier New', monospace; color: #1a1a1a; background: transparent; box-sizing: border-box; padding: 0; display: flex; align-items: center; justify-content: center; }
    .cw-number { position: absolute; top: 2px; left: 3px; font-size: 10px; color: #555555; line-height: 1; }
    .cw-circle::after { content: ''; position: absolute; top: 50%; left: 50%; width: 32px; height: 32px; border: 2px solid #1a1a1a; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    .cw-input.prefilled { background-color: #e0e0e0; color: #333333; }

    .love-result-box { display: flex; gap: 15px; }
    .love-input { width: 50px; height: 50px; border-bottom: 3px solid #1a1a1a; background: transparent; text-align: center; font-size: 30px; font-weight: bold; color: #1a1a1a; font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }

    .shadow-wall { width: 320px; height: 140px; border-radius: 4px; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; background-color: #ffffff; border: 2px solid #1a1a1a; box-shadow: 4px 4px 0 #1a1a1a; position: relative; }
    .candle-container { display: flex; gap: 20px; }
    .candle-btn { width: 55px; height: 70px; background: transparent; border: none; position: relative; display: flex; align-items: flex-end; justify-content: center; font-size: 38px; filter: grayscale(100%); }
    .candle-flame { position: absolute; top: -20px; font-size: 30px; opacity: 1; }

    .compass-wrapper { position: relative; width: 160px; height: 160px; border: 4px solid #1a1a1a; border-radius: 50%; background: #ffffff; margin: 15px auto; box-shadow: 3px 3px 0 #1a1a1a; }
    .compass-mark { position: absolute; font-weight: bold; color: #1a1a1a; font-size: 20px; z-index: 1; }
    .mark-n { top: 10px; left: 50%; transform: translateX(-50%); }
    .mark-s { bottom: 10px; left: 50%; transform: translateX(-50%); }
    .mark-e { right: 12px; top: 50%; transform: translateY(-50%); }
    .mark-w { left: 12px; top: 50%; transform: translateY(-50%); }
    .compass-needle-fixed { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; display: flex; align-items: center; justify-content: center; }
    
    .lubber-line { position: absolute; width: 3px; height: 22px; background: #1a1a1a; }
    .lubber-line::before { content: '▲'; position: absolute; top: 16px; left: 50%; transform: translateX(-50%); font-size: 18px; color: #1a1a1a; }

    .cocktail-glass { width: 70px; height: 150px; border: 4px solid #1a1a1a; border-top: none; border-radius: 0 0 10px 10px; background: #ffffff; display: flex; flex-direction: column-reverse; overflow: hidden; }
    .liquid-drop { width: 100%; height: 40px; border-top: 1px dashed #1a1a1a; }
    .drop-base { background-color: #dcdcdc; }
    .drop-syrup { background-color: #a0a0a0; }
    .drop-soda { background-color: #666666; }

    .watch-face { position: relative; width: 140px; height: 140px; border: 4px solid #1a1a1a; border-radius: 50%; background: #ffffff; margin-bottom: 15px; box-shadow: 3px 3px 0 #1a1a1a; }
    .watch-center { position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; background: #1a1a1a; border-radius: 50%; transform: translate(-50%, -50%); z-index: 4; }
    .hand-hour { position: absolute; top: 50%; left: 50%; width: 7px; height: 42px; background: #1a1a1a; transform-origin: bottom center; margin-left: -3.5px; margin-top: -42px; z-index: 2; border-radius: 2px; }
    .hand-minute { position: absolute; top: 50%; left: 50%; width: 5px; height: 60px; background: #555; transform-origin: bottom center; margin-left: -2.5px; margin-top: -60px; z-index: 3; border-radius: 2px; }
    .watch-mark { position: absolute; font-size: 16px; font-weight: bold; color: #1a1a1a; }
    .mark-12 { top: 6px; left: 50%; transform: translateX(-50%); }
    .mark-3 { top: 50%; right: 8px; transform: translateY(-50%); }
    .mark-6 { bottom: 6px; left: 50%; transform: translateX(-50%); }
    .mark-9 { top: 50%; left: 8px; transform: translateY(-50%); }

    /* [핵심 수정] 10번 챕터: W A V E 글자와 구분선이 절대 증발하지 않도록 고정 크기 및 단순 레이아웃 적용 */
    .velvet-box-new { 
      background: #ffffff; 
      border: 3px solid #1a1a1a; 
      padding: 36px 25px; 
      text-align: center; 
      width: 310px; 
      position: relative; 
      margin: 0 auto; 
      box-shadow: 4px 4px 0 #1a1a1a; 
      box-sizing: border-box;
    }
    .gold-foil-text { 
      font-family: 'Courier New', monospace; 
      font-size: 24px; 
      font-weight: bold; 
      color: #1a1a1a; 
      margin-bottom: 24px; 
      letter-spacing: 2px; 
    }
    .flat-brass-panel { 
      background: #ffffff; 
      padding: 6px; 
      border-radius: 4px; 
      border: 2px solid #1a1a1a; 
      width: 204px; 
      margin: 0 auto; 
      box-sizing: border-box;
    }
    .brass-dial-group { 
      display: flex; 
      justify-content: center;
      background: #f0f0f0; 
      border: 1px solid #1a1a1a;
    }
    .brass-dial-column { 
      width: 46px; 
      height: 54px; 
      border-right: 1px solid #1a1a1a; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      box-sizing: border-box;
    }
    .brass-dial-column:last-child { border-right: none; }
    .brass-dial-value { 
      font-family: 'Courier New', monospace; 
      font-size: 30px; 
      font-weight: bold; 
      color: #1a1a1a; 
      line-height: 1;
    }

    .gem-board { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; padding: 25px; background: #ffffff; border: 3px solid #1a1a1a; border-radius: 12px; box-shadow: 4px 4px 0 #1a1a1a; }
    .gem-btn { width: 85px; height: 60px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 2px solid #1a1a1a; border-radius: 6px; padding: 0; outline: none; }
    
    .address-note { background: #ffffff; border: 2px solid #1a1a1a; padding: 20px; border-radius: 6px; font-size: 18px; text-align: center; box-shadow: 3px 3px 0 #1a1a1a; }
    .postal-group { display: flex; gap: 10px; margin: 15px 0; justify-content: center; }
    .postal-input { width: 45px; height: 55px; font-size: 24px; text-align: center; border: 2px solid #1a1a1a; border-radius: 6px; font-weight: bold; font-family: 'Courier New', monospace; background: #ffffff; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  </style>
</head>
<body>

  <div id="viewport-container">
    <div id="print-wrapper">
      <div class="a5-paper" id="capture-area">
        <h2 class="tt-title" id="chapter-title">로딩 중...</h2>
        
        <div class="question-box" id="question-text"></div>
        <div class="puzzle-view" id="puzzle-view"></div>
        <div class="explanation" id="explanation-text"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="custom-btn" id="prev-btn">◀ 이전 해설</button>
    <button class="custom-btn btn-highlight" id="download-png-btn">🖼️ 현재 해설 300dpi PNG 저장</button>
    <button class="custom-btn btn-dark" id="download-all-png-btn">🗂️ 전체(13장) 300dpi PNG 일괄 저장</button>
    <button class="custom-btn" id="download-pdf-btn">📄 현재 해설 PDF</button>
    <button class="custom-btn" id="download-all-pdf-btn">📚 전체(13쪽) 합본 PDF</button>
    <button class="custom-btn" id="next-btn">다음 해설 ▶</button>
  </div>

  <script>
    const pipelinePathIndices = [0, 5, 10, 11, 6, 7, 2, 3, 4, 9, 8, 13, 14, 19, 18, 17, 22, 23, 24];
    const pipelineTiles = [
        {t: 'L', a: 180}, {t: 'I', a: 90},  {t: 'L', a: 90},  {t: 'I', a: 90},  {t: 'L', a: 180},
        {t: 'I', a: 0},   {t: 'L', a: 90},  {t: 'L', a: 270}, {t: 'T', a: 0},  {t: 'L', a: 270},
        {t: 'L', a: 0},   {t: 'L', a: 270}, {t: 'L', a: 180},  {t: 'L', a: 0}, {t: 'T', a: 0},
        {t: 'I', a: 0},   {t: 'L', a: 270},  {t: 'T', a: 0}, {t: 'I', a: 90}, {t: 'L', a: 270},
        {t: 'L', a: 0},   {t: 'I', a: 90},   {t: 'L', a: 0}, {t: 'I', a: 90},  {t: 'T', a: 0}
    ];
    let pipelineGridHtml = '';
    pipelineTiles.forEach((tile, index) => {
        const isPath = pipelinePathIndices.includes(index);
        const color = isPath ? '#1a1a1a' : '#888888'; 
        let svg = '';
        if (tile.t === 'L') {
            svg = '<path d="M 50 0 L 50 50 L 100 50" fill="none" stroke="' + color + '" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter"/>';
        } else if (tile.t === 'I') {
            svg = '<line x1="50" y1="0" x2="50" y2="100" stroke="' + color + '" stroke-width="14" stroke-linecap="square"/>';
        } else {
            svg = '<path d="M 0 50 L 100 50 M 50 50 L 50 100" fill="none" stroke="' + color + '" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter"/>';
        }
        pipelineGridHtml += '<div style="width: 45px; height: 45px; background-color: #ffffff; border: 1px solid #1a1a1a; transform: rotate(' + tile.a + 'deg);"><svg viewBox="0 0 100 100" style="width: 100%; height: 100%;">' + svg + '</svg></div>';
    });

    const pipelineFinalHtml = `
      <div style="background: #ffffff; border: 2px solid #1a1a1a; padding: 25px; border-radius: 4px; color: #1a1a1a; font-size: 15px; display: flex; flex-direction: column; align-items: center; box-shadow: 3px 3px 0 #1a1a1a;">
        <div style="position: relative;">
          <div style="position: absolute; top: 6px; left: -35px; color: #1a1a1a; font-size: 26px; font-weight: bold;">➔</div>
          <div style="display: grid; grid-template-columns: repeat(5, 45px); grid-template-rows: repeat(5, 45px); gap: 2px; background-color: #1a1a1a; padding: 4px; border-radius: 4px; margin-bottom: 15px;">
            ${pipelineGridHtml}
          </div>
          <div style="position: absolute; bottom: 6px; right: -35px; color: #1a1a1a; font-size: 26px; font-weight: bold;">➔</div>
        </div>
        <span style="color: #1a1a1a; font-weight: bold;">[진한 선이 완성된 올바른 길입니다]</span>
      </div>
    `;

    // 완벽한 흑백/회색조(모노톤) 팔레트
    const gemTones = [
      { top: "#e8e8e8", left: "#b4b4b4", right: "#8c8c8c", center: "#d2d2d2" },
      { top: "#dcdcdc", left: "#9e9e9e", right: "#737373", center: "#bebebe" },
      { top: "#cccccc", left: "#888888", right: "#5a5a5a", center: "#aaaaaa" },
      { top: "#b8b8b8", left: "#707070", right: "#414141", center: "#969696" }
    ];

    const solutionData = [
      {
        title: "0. 프롤로그",
        question: "이 바구니가\n영영 파도에 휩쓸리지 않고\n육지에 무사히 닿기를\n오, 신이시여 부디 자비를!",
        explanation: "바구니에 적힌 글의 각 줄 첫 글자(이, 영, 육, 오)를 읽어 자물쇠 다이얼을 '2065'로 맞춥니다.",
        html: `
          <div class="dial-lock-container">
            ${[2, 0, 6, 5].map(v => `
              <div class="dial-digit">
                <div class="dial-value">${v}</div>
              </div>
            `).join('')}
          </div>
        `
      },
      {
        title: "1. 달콤한 기억의 조각",
        question: "항해 일지의 일부: 우리는 눈부신 정오의 햇살 아래, 흰 비둘기의 안내를 따라 거센 물결을 헤쳐 나갔다.",
        explanation: "항해 일지 내용 중 '햇살(태양)', '흰 비둘기(갈매기)', '물결'이 순서대로 언급됩니다. 해당 기호를 순서대로 찾아서 맞추면 됩니다.",
        html: `
          <div class="symbol-lock-container">
            <div class="symbol-btn">☀️</div>
            <div class="symbol-btn">🕊️</div>
            <div class="symbol-btn">🌊</div>
          </div>
        `
      },
      {
        title: "2. 기사단 입단식",
        question: "사관학교를 무사히 졸업하고 파도 기사단에 정식으로 발을 들이는 것을 보니 감회가 새롭구나.\n\n기사단에 몸담는다는 건 네 짐작보다 훨씬 무겁고 험난한 일일 테지. 하지만 스스로 맹세한 길이니, 거침없이 나아가 사르디나의 가장 무거운 닻을 지키는 파도가 되길 바란다.",
        explanation: "편지 본문에서 마력이 담긴 푸른색 글자를 색이 옅은 하늘색부터 가장 짙은 남색 순서(파-도-의-기-사)대로 조합해 입력합니다.",
        html: `
          <div class="magic-slot-group">
            <div class="magic-slot">파</div>
            <div class="magic-slot">도</div>
            <div class="magic-slot">의</div>
            <span class="magic-space"></span>
            <div class="magic-slot">기</div>
            <div class="magic-slot">사</div>
          </div>
        `
      },
      {
        title: "3. 장마철의 악몽",
        question: "뒤섞인 서류 복구하기\n(월별 교역량 추이 분석)",
        explanation: "조각난 9개의 서류를 클릭하여 서로의 위치를 맞바꾸는 직소 퍼즐입니다. 서류 상단에 큰 글씨(제목)가 오고 하단에 꺾은선 그래프가 오도록 이미지를 완성하면 됩니다.",
        html: `
          <div class="jigsaw-board">
            ${[...Array(9)].map((_, i) => {
              const x = (i % 3) * -75;
              const y = Math.floor(i / 3) * -75;
              return `
                <div class="jigsaw-piece">
                  <img src="clue_paper.png" alt="piece-${i}" style="left: ${x}px; top:${y}px;">
                </div>
              `;
            }).join('')}
          </div>
        `
      },
      {
        title: "4. 스며든 시간 속 애정",
        question: "십자말풀이를 완성하세요.",
        explanation: "크로스워드의 가로/세로 단어 정답(BLUE, WAVE, OCEAN, SEA)을 올바르게 채우면 동그라미 쳐진 알파벳들이 순서대로 'L, O, V, E'가 됩니다.",
        html: `

    // 캔버스의 모든 컬러 픽셀(이모지 등)을 직접 순수 회색조로 변환하는 함수
    function applyGrayscaleToCanvas(canvas) {
      try {
        const ctx = canvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          if (r !== g || g !== b) {
            let gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
            gray = Math.min(255, Math.max(0, Math.round((gray - 128) * 1.15 + 128)));
            data[i] = gray;
            data[i + 1] = gray;
            data[i + 2] = gray;
          }
        }
        ctx.putImageData(imgData, 0, 0);
      } catch (e) {
        console.warn("로컬 보안 정책으로 픽셀 변환이 제한되었습니다.", e);
      }
    }

    async function captureCurrentPageHighRes() {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      const savedScrollX = window.scrollX;
      const savedScrollY = window.scrollY;
      window.scrollTo(0, 0);

      const captureArea = document.getElementById('print-wrapper');
      const exportScale = TARGET_WIDTH_PX / captureArea.offsetWidth;

      const capturedCanvas = await html2canvas(captureArea, {
        scale: exportScale,
        width: captureArea.offsetWidth,
        height: captureArea.offsetHeight,
        scrollX: 0,
        scrollY: 0,
        windowWidth: 1200,
        backgroundColor: "#ffffff",
        useCORS: true,
        allowTaint: true
      });

      window.scrollTo(savedScrollX, savedScrollY);

      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = TARGET_WIDTH_PX;
      finalCanvas.height = TARGET_HEIGHT_PX;
      const ctx = finalCanvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, TARGET_WIDTH_PX, TARGET_HEIGHT_PX);
      ctx.drawImage(capturedCanvas, 0, 0, TARGET_WIDTH_PX, TARGET_HEIGHT_PX);

      // 이모지 등 컬러 요소를 픽셀 단위로 강제 흑백 변환
      applyGrayscaleToCanvas(finalCanvas);

      return finalCanvas;
    }

    function injectPngDpi(dataUrl, dpi) {
      const ppm = Math.ceil(dpi / 0.0254);
      const base64 = dataUrl.split(',')[1];
      const binaryStr = atob(base64);
      const len = binaryStr.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryStr.charCodeAt(i);
      }

      const physChunk = new Uint8Array(21);
      const view = new DataView(physChunk.buffer);
      view.setUint32(0, 9, false);
      physChunk[4] = 0x70; physChunk[5] = 0x48; physChunk[6] = 0x59; physChunk[7] = 0x73;
      view.setUint32(8, ppm, false);
      view.setUint32(12, ppm, false);
      physChunk[16] = 1;

      let crc = 0xffffffff;
      for (let i = 4; i < 17; i++) {
        crc ^= physChunk[i];
        for (let j = 0; j < 8; j++) {
          crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
        }
      }
      view.setUint32(17, (crc ^ 0xffffffff) >>> 0, false);

      const output = new Uint8Array(len + 21);
      output.set(bytes.subarray(0, 33), 0);
      output.set(physChunk, 33);
      output.set(bytes.subarray(33), 54);

      return new Blob([output], { type: 'image/png' });
    }

        alert("전체 PDF 저장 중 오류가 발생했습니다.");

      } finally {
